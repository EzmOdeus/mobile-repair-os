          "422": {
            "$ref": "#/components/responses/ValidationError"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ]
      }
    },
    "/auth/2fa/enable": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Enable two-factor",
        "description": "يؤكد السر المعلّق برمز TOTP صالح ويفعّل 2FA، ويعيد 8 رموز استرداد مرة واحدة فقط.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "code"
                ],
                "properties": {
                  "code": {
                    "type": "string",
                    "pattern": "^\\d{6}$"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "twoFactorEnabled, recoveryCodes, message"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ]
      }
    },
    "/auth/2fa/disable": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Disable two-factor",
        "description": "يتطلب كلمة المرور الحالية + رمز TOTP صالح أو رمز استرداد.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "password",
                  "code"
                ],
                "properties": {
                  "password": {
                    "type": "string",
                    "format": "password"
                  },
                  "code": {
                    "type": "string",
                    "minLength": 6,
                    "maxLength": 20
                  }

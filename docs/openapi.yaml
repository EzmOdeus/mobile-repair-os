            "bearerAuth": []
          }
        ]
      }
    },
    "/auth/2fa/setup": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Begin two-factor setup",
        "description": "يولّد سر TOTP جديدًا ويُرجع secret وotpauthUri وqrDataUrl. لا يفعّل 2FA حتى تأكيد الرمز عبر /auth/2fa/enable.",
        "responses": {
          "200": {
            "description": "secret, otpauthUri, qrDataUrl, message"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"

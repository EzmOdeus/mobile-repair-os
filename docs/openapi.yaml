    "/auth/2fa/verify": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Verify two-factor login challenge",
        "description": "يُستدعى بعد POST /auth/login عندما يعيد twoFactorRequired=true. يقبل رمز TOTP من 6 أرقام أو رمز استرداد، ويعيد الجلسة الكاملة عند النجاح.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "challengeToken",
                  "code"
                ],
                "properties": {
                  "challengeToken": {
                    "type": "string",
                    "description": "توكن التحدي قصير العمر (5 دقائق)"
                  },
                  "code": {
                    "type": "string",
                    "minLength": 6,
                    "maxLength": 20,
                    "description": "رمز TOTP من 6 أرقام أو رمز استرداد بصيغة xxxx-xxxx-xxxx"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "accessToken, refreshToken, expiresIn, user, organization"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
